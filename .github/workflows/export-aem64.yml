name: export-langfuse-arm64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-aem64.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - langfuse/langfuse:3.224.3
          - langfuse/langfuse-worker:3.224.3
          - clickhouse/clickhouse-server:25.12
          - redis:7
          - minio/minio:latest
    steps:
      - name: install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: export arm64 image
        run: |
          set -euo pipefail
          img="${{ matrix.image }}"

          # 候选源：minio 的 docker hub 仓库已失效，改走 bitnami / quay
          if [ "$img" = "minio/minio:latest" ]; then
            candidates=( "bitnami/minio:latest" "quay.io/minio/minio:latest" )
          else
            candidates=( "$img" )
          fi

          ok=0
          for c in "${candidates[@]}"; do
            if [[ "$c" == */* ]]; then
              src="docker://docker.io/$c"
            else
              src="docker://docker.io/library/$c"
            fi
            safe="$(echo "$c" | tr '/:' '_')"
            echo "尝试 $c  <-  $src"
            if skopeo copy --override-arch arm64 --override-os linux \
                 "$src" "docker-archive:${safe}.tar:${c}"; then
              echo "SAFE=$safe" >> "$GITHUB_ENV"
              echo "IMG=$c" >> "$GITHUB_ENV"
              ok=1
              break
            fi
            echo "::warning::$c 失败，尝试下一个源"
          done
          if [ "$ok" != "1" ]; then
            echo "::error::$img 所有候选源导出失败"
            exit 1
          fi
          ls -lh "${safe}.tar"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE }}
          path: ${{ env.SAFE }}.tar
          retention-days: 14

  release:
    needs: export
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: images
          merge-multiple: true

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="langfuse-arm64-${{ github.run_number }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Langfuse ARM64 images ($tag)" \
              --notes "arm64 镜像导出包（skopeo 生成），用于内网 docker load。minio 若来自 bitnami 源，load 后请相应改镜像名。"
          fi
          if compgen -G "images/*.tar" >/dev/null; then
            gh release upload "$tag" images/*.tar --clobber
          fi
          gh release view "$tag"
