name: export-langfuse-arm64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-aem64.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - langfuse/langfuse:3.224.3
          - langfuse/langfuse-worker:3.224.3
          - clickhouse/clickhouse-server:25.12
          - redis:7
          - minio/minio:latest
    steps:
      - name: pull + save arm64
        run: |
          set -euo pipefail
          img="${{ matrix.image }}"

          if ! docker pull --platform linux/arm64 "$img"; then
            echo "::warning::$img 首次拉取失败，重试一次"
            sleep 15
            if ! docker pull --platform linux/arm64 "$img"; then
              if [ "$img" = "minio/minio:latest" ]; then
                echo "::warning::minio/minio 拉取失败，改用 quay.io/minio/minio:latest"
                img="quay.io/minio/minio:latest"
                docker pull --platform linux/arm64 "$img"
              else
                echo "::error::$img 拉取失败"
                exit 1
              fi
            fi
          fi

          SAFE="$(echo "$img" | tr '/:' '_')"
          echo "SAFE=$SAFE" >> "$GITHUB_ENV"
          echo "IMG=$img" >> "$GITHUB_ENV"
          docker save "$img" -o "${SAFE}.tar"
          ls -lh "${SAFE}.tar"

      - name: verify tar is arm64
        run: |
          python3 - "${SAFE}.tar" <<'PY'
          import tarfile, json, sys
          with tarfile.open(sys.argv[1]) as tf:
              m = json.loads(tf.extractfile("manifest.json").read())[0]
              cfg = json.loads(tf.extractfile(m["Config"]).read())
          arch = cfg.get("architecture", "")
          print(f"architecture = {arch}")
          if arch != "arm64":
              print(f"!! {sys.argv[1]} 是 {arch}，不是 arm64", file=sys.stderr)
              sys.exit(1)
          PY

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE }}
          path: ${{ env.SAFE }}.tar
          retention-days: 14

  release:
    needs: export
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: images
          merge-multiple: true

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="langfuse-arm64-${{ github.run_number }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Langfuse ARM64 images ($tag)" \
              --notes "arm64 镜像 docker save 导出包，用于内网 docker load 导入。"
          fi
          if compgen -G "images/*.tar" >/dev/null; then
            gh release upload "$tag" images/*.tar --clobber
          fi
          gh release view "$tag"
